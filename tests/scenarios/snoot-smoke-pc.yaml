# Humo de PC (D22): el mismo recorrido que snoot-smoke, contra una traza del propio backend SDL.
id: snoot-smoke-pc
reference: tests/reference/traces/pc/snoot-smoke.trace
inputs:
  - wait: 60
  - press: CROSS
  - wait: 60
  - advance: 30
expect:
  - {ev: SCENE}
compare:
  events: [SAY, SHOW, HIDE, SCENE, PLAY, STOP, MENU, CHOICE]
  tolerance: {frames: 6}
limits:
  max_seconds: 300
