# Humo de la Fase 2 (G2): desde el título, Comenzar y 30 líneas. La referencia es una traza del propio motor en
# PS1 (regresión); la comparación con Ren'Py es de la Fase 3 y necesita los ids del compilador en las dos trazas.
# El motor no emite LABEL todavía (el VNB no guarda nombres de etiqueta).
id: snoot-smoke
reference: tests/reference/traces/ps1/snoot-smoke.trace
inputs:
  - wait: 60
  - press: CROSS
  - wait: 60
  - advance: 30
expect:
  - {ev: SCENE}
compare:
  events: [SAY, SHOW, HIDE, SCENE, PLAY, STOP, MENU, CHOICE]
  tolerance: {frames: 6}
limits:
  max_seconds: 300
