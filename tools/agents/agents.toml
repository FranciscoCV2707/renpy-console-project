# Agentes para dispatch.py. Solo Claude edita este archivo.
# Flags verificados con --help el 2026-10-26: opencode 2.1.4, codex 0.163.0, kilo 7.8.17, vibe 3.0.2, agy 1.4.7,
# claude 2.1.310.

[settings]
# La rama integration se crea en la Fase 4 (PLAN.md seccion 7); hasta entonces se parte de main
base_branch = "main"
worktree_root = "../renpy-console-wt"
default_timeout_min = 45
# opencode, codex y kilo son .CMD de npm en Windows: el prompt no puede llevar & | < > ^ % " ni saltos de linea
prompt_template = "Eres el agente {agent} del proyecto renpy-console-project. Primero lee AGENTS.md. Luego lee tu tarea en .agents/inbox/{task}.md y ejecutala. Trabaja solo dentro de este directorio. Al terminar corre las verificaciones que pide la tarea, haz commit en tu rama actual y escribe tu reporte en reports/{task}.md usando la plantilla .agents/templates/REPORT.md. No hagas push, merge ni rebase. Si te bloqueas, describe el bloqueo en el reporte y termina."

[agents.beam]
cmd = ["opencode", "run", "-m", "opencode-go/beam-free", "--auto", "{prompt}"]
max_parallel = 5          # enjambre de 5 (PLAN.md D10); bajar si aparecen errores 429 o timeouts
timeout_min = 90          # T-302 corre Ren'Py de verdad

[agents.codex]
cmd = ["codex", "exec", "--sandbox", "workspace-write", "-C", "{worktree}", "{prompt}"]
# Su sandbox de Windows no deja escribir en .git ni en .agents (ni con --add-dir) ni usar el temporal global:
# el commit lo hace dispatch.py y las pruebas usan .tmp/ del worktree
auto_commit = true
env = { TMP = "{worktree}/.tmp", TEMP = "{worktree}/.tmp" }
max_parallel = 1
timeout_min = 120

[agents.kilo]
# --dir: sin él kilo trabaja en el repo principal aunque se lance desde el worktree (pasó en la prueba de humo)
cmd = ["kilo", "run", "--auto", "--dir", "{worktree}", "-m", "xiaomi-token-plan-sgp/mimo-v2.6-pro", "{prompt}"]
max_parallel = 1
timeout_min = 120

[agents.vibe]
cmd = ["vibe", "--prompt", "{prompt}", "--max-turns", "40", "--output", "json", "--trust", "--auto-approve"]
max_parallel = 1
timeout_min = 45

[agents.agy]
# agy -p ya responde sin terminal en 1.4.7 (probado). Para tareas largas o de interfaz, mejor una terminal de Orca.
cmd = ["agy", "-p", "{prompt}", "--mode", "auto", "--print-timeout", "2400s"]
max_parallel = 1
timeout_min = 45

[agents.claude]
# Gasta la cuota de Claude: solo revisiones puntuales o desbloqueos
# auto: acceptEdits no deja correr git commit ni las pruebas en modo -p
cmd = ["claude", "-p", "{prompt}", "--permission-mode", "auto"]
max_parallel = 1
timeout_min = 45

# Sustituto si Beam deja de estar disponible (ver `opencode models`):
# [agents.gomodel]
