# Teclado del anuario (capitulo 13D, ruta 4): llega por el menu de desarrollo (L1+R1+Select),
# salta el capitulo con R1 y, con el teclado abierto, escribe con la cruceta (h, i), borra una letra,
# pasa a mayusculas (I) y confirma con Start. Lo escrito no lo usa el guion (renpy.input sin
# asignacion, 13D linea 3240); lo que se prueba son los controles.
